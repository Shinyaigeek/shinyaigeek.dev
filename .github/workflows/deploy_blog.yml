name: Deploy blog to VPS

on:
    # main.yml calls this once CI has passed on a push to main.
    workflow_call:
    # The contribution calendar on /activity/ is baked in at build time, so it
    # only refreshes when the site is rebuilt. Redeploy nightly at 03:00 JST
    # (18:00 UTC) to keep it current between pushes.
    schedule:
        - cron: "0 18 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        # VPS_SECRET_KEY / SSH_* live as Environment secrets under "Production",
        # so the job must select that environment for them to resolve.
        environment: Production
        # Never let two deploys race on the same VPS doc root. On the job, so a
        # manual or nightly run queues behind the one main.yml calls.
        concurrency:
            group: deploy-blog
            cancel-in-progress: false
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The same setup CI uses. Its install runs no lifecycle scripts either:
            # strictDepBuilds with every allowBuilds entry false means none run.
            - uses: ./.github/actions/setup

            # GITHUB_TOKEN feeds the contribution calendar on /activity/: the
            # GraphQL API needs auth even for public data. The build only warns
            # and drops the calendar if it is missing or the call fails, so this
            # never blocks a deploy.
            - name: Build blog (rspack + SSG)
              run: pnpm --filter blog build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Mirrors the legacy ops/deploy.sh: copy the built `public/` (which
            # contains ja/, en/ and assets/) into /var/www/blog/ so h2o serves
            # /var/www/blog/public/{ja,en,assets}.
            - name: Deploy public/ to VPS over scp
              env:
                  VPS_SECRET_KEY: ${{ secrets.VPS_SECRET_KEY }}
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
              run: |
                  set -euo pipefail
                  mkdir -p ~/.ssh
                  printf '%s\n' "$VPS_SECRET_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                  scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r \
                      packages/applications/blog/public \
                      "$SSH_USER@$SSH_HOST:/var/www/blog/"
