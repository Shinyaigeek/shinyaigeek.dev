name: Deploy worker to Cloudflare

on:
    # main.yml calls this once CI has passed, when a push touched the worker.
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are Environment secrets
        # under "Production", next to the VPS ones.
        environment: Production
        concurrency:
            group: deploy-worker
            cancel-in-progress: false
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            # A manual dispatch skips main.yml's CI, and this worker fronts every
            # page of the blog, so its own tests run before it goes out.
            - name: Test the worker
              run: pnpm --filter worker test
            # Routes live in the Cloudflare dashboard, not wrangler.toml, and
            # wrangler leaves routes it was not given alone.
            - name: Deploy with wrangler
              run: pnpm --filter worker worker:publish
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
