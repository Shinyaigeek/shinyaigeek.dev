# Language routing worker: sends visitors who prefer English to the English
# host. Moved here from the repo root so the config sits with the worker it
# configures, and rewritten for wrangler v4 -- the old file was still in the
# v1 format (`type`, `[build.upload]`), which current wrangler rejects.
name = "handle-language"
main = "src/index.ts"
compatibility_date = "2026-07-26"
workers_dev = true

# Every host the blog is served on, so the routes are in the repo rather than
# only in the dashboard: wrangler deploy sets exactly these. The bare and www
# hosts get the language redirect; ja. and en. only the Markdown negotiation.
routes = [
	{ pattern = "shinyaigeek.dev/*", zone_name = "shinyaigeek.dev" },
	{ pattern = "www.shinyaigeek.dev/*", zone_name = "shinyaigeek.dev" },
	{ pattern = "ja.shinyaigeek.dev/*", zone_name = "shinyaigeek.dev" },
	{ pattern = "en.shinyaigeek.dev/*", zone_name = "shinyaigeek.dev" },
]
